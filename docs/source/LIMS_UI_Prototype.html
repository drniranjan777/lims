A.wRowDel=d=>{const w=wk(param);w[d.t].splice(d.i,1);render();A.tab({i:d.t==='equip'?3:2},$('.tabs button'))};
// Review
A.rvApprove=()=>{const w=wk(param);const all=[...document.querySelectorAll('.rvchk')].every(c=>c.checked);if(!all){toast('Complete the verification checklist before approving.');return}
  w.status='Approved';w.reviewedBy=me();w.reviewNote=$('#rvNote').value;const r=reg(w.reg);
  if(allApproved(r.id)&&r.report==='Draft'){r.report='Preview';notify(['secapp','signatory'],`All sections approved for ${r.id} — report ready for preview & release.`,'report/'+r.id)}
  else if(!allApproved(r.id)) {const pend=Object.entries(secProgress(r.id)).filter(([,x])=>x.approved<x.total).map(([s])=>s);if(Object.keys(secProgress(r.id)).length>1)notify(['crm','secapp'],`Combined report ${r.id} awaiting completion of ${pend.join(' & ')}.`,'report/'+r.id)}
  toast('Test data approved.');render()};
A.rvReturn=()=>{const w=wk(param);const note=$('#rvNote').value.trim();if(!note){toast('Add a reviewer comment explaining the correction.');$('#rvNote').focus();return}
  w.status='Correction Required';w.returnNote=note;w.reviewedBy=me();w.signed=null;notify(['analyst'],`${TESTS[w.code].name} (${w.reg}) returned for correction.`,'analyst/'+w.id);toast('Returned to analyst for correction.');render()};
// Reports
A.rOpt=(d,el)=>{const r=reg(param);r[d.k]=el.type==='checkbox'?el.checked:d.v;$('#paper').innerHTML=paperHTML(r)};
A.release=()=>{const r=reg(param);if(!allApproved(r.id)){toast('All sections must be approved first.');return}r.report='Released';r.releasedOn=TODAY;notify(['crm','accounts'],`Report ${r.no} released — ready for customer submission & invoicing.`,'dispatch');toast(`Report released · CRM & Accounts notified.`);render()};
A.nudge=()=>{toast('Pending section approvers notified.')};
// Dispatch
A.dispatchNew=d=>{const r=reg(d.id),multi=Object.keys(secProgress(r.id)).length>1;openModal(`Record dispatch · ${r.no}`,`<div class="fgrid">
  <label class="f full"><span>Documents</span><select name="docs"><option>Test report (soft copy e-mailed + hard copy)</option><option>Test report + Tax invoice (hard copy)</option><option>Test report (soft copy only)</option></select></label>
  <label class="f req"><span>Dispatch date</span><input type="date" name="date" value="${TODAY}" required></label><label class="f req"><span>Dispatched by</span><input name="by" value="${esc(me())}" required></label>
  <label class="f"><span>Courier</span><input name="courier" placeholder="Blue Dart, DTDC, By hand…"></label><label class="f"><span>AWB / docket no.</span><input name="awb" class="mono"></label>
  ${multi?`<label class="full" style="display:flex;gap:8px;font-size:13px"><input type="checkbox" name="combined" required> I verify this combined report includes results from all sections (${Object.keys(secProgress(r.id)).join(', ')}).</label>`:''}</div>`,'Save dispatch',f=>{
  S.dispatch.unshift({id:'D-0'+(++S.seq.d),reg:r.id,docs:f.docs,date:f.date,by:f.by,courier:f.courier,awb:f.awb,rcvDate:null,rcvBy:'',combinedOk:!!f.combined});r.report='Submitted/Dispatched';toast('Dispatch recorded.')})};
A.dispatchRcv=d=>{const x=S.dispatch.find(y=>y.id===d.id);openModal('Confirm receipt at customer end',`<div class="fgrid"><label class="f req"><span>Date received</span><input type="date" name="d" value="${TODAY}" required></label><label class="f req"><span>Received by (customer side)</span><input name="b" required></label></div>`,'Confirm',f=>{x.rcvDate=f.d;x.rcvBy=f.b;const inv=invFor(x.reg);if(inv&&inv.status==='Issued'&&/invoice/i.test(x.docs))inv.status='Dispatched';toast('Receipt confirmed.')})};
// Stores
A.storeIn=d=>{const r=reg(d.id);openModal(`Receive remnant sample · ${r.no}`,`<div class="fgrid"><label class="f req"><span>Date received in store</span><input type="date" name="d" value="${TODAY}" required></label><label class="f req"><span>Received by</span><input name="b" value="${esc(me())}" required></label><label class="f"><span>Storage location</span><input name="loc" placeholder="Rack / shelf"></label><div class="row" style="align-items:flex-end"><label class="f" style="flex:1"><span>Retention period</span><input type="number" name="rv" value="${r.template==='Pharma'?6:30}" min="1" id="rv"></label><select name="ru" id="ru" style="width:auto"><option ${r.template==='Pharma'?'':'selected'}>days</option><option ${r.template==='Pharma'?'selected':''}>months</option></select></div><div class="full small muted" id="plan"></div></div>`,'Save',f=>{S.stores.unshift({id:'ST-0'+(++S.seq.st),reg:r.id,sample:r.sample,cust:r.cust,inDate:f.d,inBy:f.b,retVal:+f.rv,retUnit:f.ru,loc:f.loc||'—',actual:null,method:'',by:''});toast('Remnant sample received in store.')});
  const upd=()=>{const s={inDate:$('#mform [name=d]').value,retVal:$('#rv').value,retUnit:$('#ru').value};$('#plan').innerHTML=`Planned disposal date (auto-calculated): <b>${fmt(plannedDisposal(s))}</b>`};$('#mform').addEventListener('input',upd);upd()};
A.dispose=d=>{const s=S.stores.find(x=>x.id===d.id);openModal(`Record disposal · ${s.reg}`,`<div class="banner mb8">${ic('info')}<div>${esc(s.sample)} · planned disposal ${fmt(plannedDisposal(s))}</div></div><div class="fgrid mt"><label class="f req"><span>Actual disposal date</span><input type="date" name="d" value="${TODAY}" required></label><label class="f req"><span>Disposed by</span><input name="b" value="${esc(me())}" required></label><label class="f full req"><span>Disposal method</span><select name="m" required><option value="">Select…</option><option>Incineration through authorised agency</option><option>Autoclaved & discarded</option><option>Dissolved & drained after neutralisation</option><option>Returned to customer</option><option>Scrapped (metal specimens)</option></select></label></div>`,'Record disposal',f=>{s.actual=f.d;s.by=f.b;s.method=f.m;toast('Disposal recorded.')})};
// Invoices
A.invNew=d=>{const r=reg(d.id),q=quote(r.q);const id='INV-26-0'+(++S.seq.inv);S.invoices.unshift({id,reg:r.id,date:TODAY,items:q.items.map(i=>({...i,desc:TESTS[i.code].name})),discount:q.discount,advance:0,relax:'none',status:'Draft',signedBy:null});notify(['signatory'],`Invoice ${id} prepared — awaiting authorization.`,'invoice/'+id);go('invoice/'+id)};
A.invStatus=d=>{const i=S.invoices.find(x=>x.id===param);i.status=d.v;if(d.v==='Approved')i.signedBy=me();toast(`Invoice ${i.id} → <b>${d.v}</b>`);render()};
// Approval
A.apSet=d=>{AP.items[d.i]={...(AP.items[d.i]||{}),v:d.v};saveAP();const y=scrollY;render();scrollTo(0,y)};
A.apComment=d=>{AP.items[d.i]={...(AP.items[d.i]||{}),c:' '};const y=scrollY;render();scrollTo(0,y);const t=document.querySelector(`[data-in=apC][data-i="${d.i}"]`);t&&(t.value='',t.focus())};
A.apReset=()=>{if(confirm('Clear all checklist responses and sign-off entries in this browser?')){AP={};saveAP();render()}};

/* ============================ INPUT BINDINGS ============================ */
const IN={
 qItem:(el,d)=>{const q=quote(param);const it=q.items[d.i];it[d.k]=['qty','rate'].includes(d.k)?+el.value:el.value;refreshQuote(q)},
 qTest:(el,d)=>{const q=quote(param),t=TESTS[el.value];Object.assign(q.items[d.i],{code:el.value,method:t.method,spec:t.spec,rate:t.rate});render()},
 qField:(el,d)=>{quote(param)[d.k]=el.value},
 qCust:el=>{quote(param).cust=el.value;render()},
 qDisc:el=>{const q=quote(param);q.discount=+el.value;refreshQuote(q)},
 dField:(el,d)=>{DRAFT[d.k]=el.value},
 dTplField:(el,d)=>{DRAFT.fields[d.k]=el.value},
 dTest:(el,d)=>{DRAFT.tests[d.i][d.k]=el.value;if(d.k==='section')render()},
 rTest:(el,d)=>{reg(param).tests[d.i][d.k]=el.value;if(d.k==='section')render()},
 wVal:(el,d)=>{const w=wk(param);w.values[d.i]=el.value===''?undefined:+el.value;w.values=w.values.slice(0,w.reps);$('#statsbox').innerHTML=statsHTML(w);updCalc(w)},
 wReps:el=>{const w=wk(param);w.reps=+el.value;w.values=w.values.slice(0,w.reps);render()},
 wField:(el,d)=>{const w=wk(param);w[d.k]=el.value;if(d.k==='result'){const c=comply(w.spec,w.result);$('#compOut').innerHTML=chip(c)||'<span class="faint small">Enter result</span>'}},
 wCalc:(el,d)=>{const w=wk(param);w.calc[d.k]=+el.value;updCalc(w)},
 wRow:(el,d)=>{wk(param)[d.t][d.i][d.k]=el.value},
 rCust:(el,d)=>{const r=reg(param);r.custEdit=r.custEdit||{...cust(r.cust)};r.custEdit[d.k]=el.value;$('#paper').innerHTML=paperHTML(r)},
 iItem:(el,d)=>{const i=S.invoices.find(x=>x.id===param);i.items[d.i][d.k]=['qty','rate'].includes(d.k)?+el.value:el.value;const a=$('#iamt'+d.i);if(a)a.textContent=inr(i.items[d.i].qty*i.items[d.i].rate);$('#itotals').innerHTML=invTotalsHTML(i)},
 iRelax:el=>{const i=S.invoices.find(x=>x.id===param);i.relax=el.value;$('#itotals').innerHTML=invTotalsHTML(i)},
 iAdv:el=>{const i=S.invoices.find(x=>x.id===param);i.advance=+el.value||0;$('#itotals').innerHTML=invTotalsHTML(i)},
 iDisc:el=>{const i=S.invoices.find(x=>x.id===param);i.discount=+el.value||0;$('#itotals').innerHTML=invTotalsHTML(i)},
 apC:(el,d)=>{AP.items[d.i]={...(AP.items[d.i]||{}),c:el.value};saveAP()},
 apS:(el,d)=>{AP.sign[d.k]=el.value;saveAP()},
};
function updCalc(w){const F=FORMULAS[w.code],s=stats(w.values);const v=F?F.fn(w.calc):s?s.avg:null;const o=$('#calcOut');if(o)o.textContent=v!=null&&isFinite(v)?round(v,2):'—'}
const CHANGE={
 dAddTest:el=>{if(!el.value)return;const t=TESTS[el.value];DRAFT.tests.push({code:el.value,method:t.method,spec:t.spec,section:t.section});render()},
 analystAs:el=>{ANALYST_AS=el.value;render()},
 wFiles:el=>{const w=wk(param);[...el.files].forEach(f=>w.files.push({name:f.name,url:URL.createObjectURL(f)}));render();A.tab({i:1},$('.tabs button'))},
};

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a||a.disabled) return;
  if(a.tagName==='A'&&a.getAttribute('href'))return;
  const fn=A[a.dataset.act]; if(!fn) return;
  if(a.tagName!=='INPUT') e.preventDefault();
  fn(a.dataset,a,e);
});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.in;if(k&&IN[k]&&el.tagName!=='SELECT')IN[k](el,el.dataset)});
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset.in;if(k&&IN[k]&&el.tagName==='SELECT')IN[k](el,el.dataset);const c=el.dataset.actChange;if(c&&CHANGE[c])CHANGE[c](el);
  if(el.id==='custSel'){const c2=cust(el.value);$('#newCust').style.display=el.value==='new'?'grid':'none';const f=$('#mform');if(c2){f.contact.value=c2.contact;f.gst.value=c2.gst}else{f.contact.value='';f.gst.value=''}}
  if(el.name==='source'){el.closest('.seg').querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.contains(el)))}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#roleSel').innerHTML=Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${r.label}</option>`).join('');
$('#roleSel').value=ROLE;
$('#roleSel').addEventListener('change',e=>{ROLE=e.target.value;try{localStorage.setItem('lims.role',ROLE)}catch(x){}toast(`Now viewing as <b>${ROLES[ROLE].label}</b> — ${me()}`);render()});
$('#menuBtn').innerHTML=ic('menu');$('#themeBtn').innerHTML=ic('moon');$('#mClose').innerHTML=ic('x');
try{const t=localStorage.getItem('lims.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
