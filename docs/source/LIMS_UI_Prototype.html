<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucid Labs LIMS Prototype</title>
<style>
:root{
  --bg:#f3f5f7; --panel:#ffffff; --panel2:#f8fafb; --text:#16202a; --muted:#5d6977; --faint:#8a95a2; --border:#e2e6eb; --border2:#d3d9df;
  --primary:#0d6b69; --primary-2:#0a5654; --primary-soft:#e0f0ef; --on-primary:#ffffff;
  --ok:#1b7a4b; --ok-soft:#e2f3e9; --warn:#935f00; --warn-soft:#fcf0d5; --bad:#b3261e; --bad-soft:#fce7e5;
  --info:#1b5ea8; --info-soft:#e3edfa; --neutral:#4a5663; --neutral-soft:#edf0f3;
  --side:#0f2a2e; --side-text:#c9d7d8; --side-muted:#7e9799; --side-active:#1c4549;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1317; --panel:#151c22; --panel2:#1a232a; --text:#e5ecf1; --muted:#98a6b3; --faint:#6f7e8b; --border:#25303a; --border2:#33404b;
    --primary:#3fb2a7; --primary-2:#62c7bd; --primary-soft:#12302e; --on-primary:#06201e;
    --ok:#52c48c; --ok-soft:#12301f; --warn:#e0b04a; --warn-soft:#33280f; --bad:#f2766d; --bad-soft:#3a1817;
    --info:#74b3f5; --info-soft:#122a45; --neutral:#aab6c1; --neutral-soft:#222c35;
    --side:#0a1013; --side-text:#c3cfd4; --side-muted:#6b7b82; --side-active:#16292d;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1317; --panel:#151c22; --panel2:#1a232a; --text:#e5ecf1; --muted:#98a6b3; --faint:#6f7e8b; --border:#25303a; --border2:#33404b;
  --primary:#3fb2a7; --primary-2:#62c7bd; --primary-soft:#12302e; --on-primary:#06201e;
  --ok:#52c48c; --ok-soft:#12301f; --warn:#e0b04a; --warn-soft:#33280f; --bad:#f2766d; --bad-soft:#3a1817;
  --info:#74b3f5; --info-soft:#122a45; --neutral:#aab6c1; --neutral-soft:#222c35;
  --side:#0a1013; --side-text:#c3cfd4; --side-muted:#6b7b82; --side-active:#16292d;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
h2{font-size:16px;font-weight:650}
h3{font-size:14px;font-weight:650}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .xs{font-size:11.5px}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12.5px}
.num{font-variant-numeric:tabular-nums;text-align:right}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Layout */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-text);position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px 24px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1fa39a,#0d6b69);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.brand b{display:block;color:#fff;font-size:15px}
.brand span{font-size:11.5px;color:var(--side-muted)}
.navgroup{margin-top:14px}
.navgroup>div{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:0 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--side-text);font-size:13.5px}
.nav a:hover{background:var(--side-active);text-decoration:none}
.nav a.active{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 #3fb2a7}
.nav a .cnt{margin-left:auto;background:#3fb2a7;color:#06201e;border-radius:10px;font-size:11px;padding:0 7px;font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 20px;min-height:58px}
.top .crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.proto{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:20px;white-space:nowrap}
.rolebox{display:flex;align-items:center;gap:8px}
.rolebox .who{text-align:right;line-height:1.2}
.rolebox .who b{display:block;font-size:13px}
.rolebox .who span{font-size:11.5px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px}
.iconbtn{position:relative;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--panel2)}
.iconbtn .badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}
#menuBtn{display:none}
#view{padding:22px 24px 60px;max-width:1440px;width:100%}

/* Components */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head .sub{margin:4px 0 0;color:var(--muted);max-width:820px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card>.bd{padding:16px}
.card>.bd.flush{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.split-l{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mt{margin-top:16px}.mt8{margin-top:8px}.mb8{margin-bottom:8px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);background:var(--panel);color:var(--text);padding:7px 13px;border-radius:8px;font:inherit;font-size:13px;font-weight:550;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel2);text-decoration:none}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:var(--primary-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border2))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled],.btn.locked{opacity:.5;cursor:not-allowed}
.btn svg.ic{width:15px;height:15px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;background:var(--neutral-soft);color:var(--neutral)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--neutral-soft);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.tag.sec{background:var(--primary-soft);color:var(--primary);border-color:transparent}

.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--panel2);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--panel2)}
.t td input,.t td select{min-width:70px}
.empty{padding:28px;text-align:center;color:var(--muted)}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f.req>span::after{content:" *";color:var(--bad)}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--text);background:var(--panel);border:1px solid var(--border2);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 35%,transparent);border-color:var(--primary)}
input[readonly],input:disabled,select:disabled,textarea:disabled{background:var(--panel2);color:var(--muted)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
textarea{min-height:72px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button,.seg label{border:none;background:transparent;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted);border-right:1px solid var(--border2);display:flex;align-items:center;gap:6px}
.seg>*:last-child{border-right:none}
.seg .on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.seg input{display:none}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px}
.checkgrid label{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:400;color:var(--text)}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:500}

.kpi{padding:14px 16px;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--primary)}
.kpi .v{font-size:26px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted)}

.pipeline{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.pipe{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 8px;cursor:pointer;min-width:0}
.pipe:hover{border-color:var(--primary)}
.pipe .n{font-size:10.5px;color:var(--faint);font-weight:600}
.pipe .c{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.pipe .t{font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:2px}
.pipe.hot{background:var(--primary-soft);border-color:transparent}
.pipe.hot .c{color:var(--primary)}

.stepper{display:flex;list-style:none;padding:0;margin:0;gap:0;overflow-x:auto}
.stepper li{flex:1;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--faint);position:relative;padding-right:14px;min-width:max-content}
.stepper li:not(:last-child)::after{content:"";flex:1;height:2px;background:var(--border2);min-width:18px}
.stepper .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--neutral-soft);color:var(--faint);flex:none}
.stepper li.done{color:var(--muted)}
.stepper li.done .dot{background:var(--ok);color:#fff}
.stepper li.done::after{background:var(--ok)}
.stepper li.cur{color:var(--text);font-weight:600}
.stepper li.cur .dot{background:var(--primary);color:var(--on-primary);box-shadow:0 0 0 4px var(--primary-soft)}
.stepper li.cur.bad .dot{background:var(--bad);color:#fff;box-shadow:0 0 0 4px var(--bad-soft)}
.stepper li.cur.bad{color:var(--bad)}

.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:9px;font-size:13px;background:var(--info-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}
.banner svg{color:var(--info);margin-top:1px}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)} .banner.warn svg{color:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)} .banner.bad svg{color:var(--bad)}
.banner.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)} .banner.ok svg{color:var(--ok)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 12px;overflow-x:auto}
.tabs button{border:none;background:none;font:inherit;font-size:13px;padding:11px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tabpane{display:none;padding:16px}
.tabpane.on{display:block}

.progress{height:6px;background:var(--neutral-soft);border-radius:4px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:4px}
.progress.ok>i{background:var(--ok)}

.sumrow{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.sumrow.total{border-top:1px solid var(--border);margin-top:6px;padding-top:10px;font-size:16px;font-weight:700}

.flowgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fstage{position:relative;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--panel);box-shadow:var(--shadow);cursor:pointer}
.fstage:hover{border-color:var(--primary)}
.fstage .no{width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:12px;font-weight:700}
.fstage h3{margin:10px 0 4px}
.fstage p{margin:0;font-size:12.5px;color:var(--muted)}
.fstage .own{margin-top:10px}
.fstage.gate{border-color:color-mix(in srgb,var(--warn) 50%,var(--border))}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.chain .node{padding:5px 10px;border-radius:7px;background:var(--panel2);border:1px solid var(--border)}
.chain .node.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.chain .node.cur{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.chain .arr{color:var(--faint)}

.list-item{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.list-item:last-child{border-bottom:none}
.list-item .dotc{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex:none}
.list-item.read .dotc{background:var(--border2)}

.drop{border:1.5px dashed var(--border2);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.drop:hover{border-color:var(--primary);color:var(--primary)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.thumb{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--panel2)}
.thumb .img{height:130px;display:grid;place-items:center;background:var(--panel);color:var(--text);overflow:hidden}
.thumb .img img{max-width:100%;max-height:100%}
.thumb .cap{padding:7px 10px;font-size:12px;display:flex;justify-content:space-between;gap:6px}

.sig{border:1px dashed var(--border2);border-radius:8px;padding:12px;min-height:64px}
.sig.done{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}

/* Report paper */
.paperwrap{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:22px;overflow-x:auto}
.paper{background:#fff;color:#1a1a1a;width:100%;max-width:800px;margin:0 auto;padding:34px 40px;box-shadow:0 2px 14px rgba(0,0,0,.14);font-size:12.5px;line-height:1.45;color-scheme:light}
.paper h2{font-size:17px;letter-spacing:.06em;text-align:center;margin:10px 0 14px;color:#0d4f4d}
.paper .phd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:2px solid #0d6b69;padding-bottom:12px}
.paper .plogo{display:flex;gap:10px;align-items:center}
.paper .plogo .logo{width:40px;height:40px;border-radius:9px;background:linear-gradient(135deg,#1fa39a,#0d6b69);color:#fff;display:grid;place-items:center;font-weight:700}
.paper .plogo b{font-size:18px;letter-spacing:.05em;color:#0d4f4d;display:block}
.paper .nabl{border:2px solid #1a1a1a;border-radius:50%;width:62px;height:62px;display:grid;place-items:center;text-align:center;font-weight:800;font-size:12px;line-height:1.1}
.paper .nabl small{display:block;font-size:8px;font-weight:600}
.paper table{width:100%;border-collapse:collapse;margin:8px 0}
.paper th,.paper td{border:1px solid #b9c2c9;padding:5px 7px;text-align:left;vertical-align:top}
.paper th{background:#eef4f4;font-weight:600}
.paper .kv td:first-child{width:24%;background:#f6f8f9;font-weight:600}
.paper .sect{font-weight:700;color:#0d4f4d;margin:14px 0 4px;text-transform:uppercase;font-size:11.5px;letter-spacing:.06em}
.paper .foot{display:flex;justify-content:space-between;margin-top:34px;gap:20px}
.paper .foot div{flex:1;border-top:1px solid #777;padding-top:5px;text-align:center;font-size:11.5px}
.paper .fig{border:1px solid #cfd6db;padding:8px;margin:8px 0;color:#0d4f4d}
.paper .fig .cap{font-size:11px;color:#444;text-align:center;margin-top:3px}
.paper .eor{text-align:center;margin-top:18px;font-size:11px;color:#555}
.paper .toc li{margin:2px 0}

/* Modal & toasts */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal-bg[hidden]{display:none}
.modal{background:var(--panel);border-radius:12px;width:min(720px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal .mb{padding:18px;overflow-y:auto}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
#toasts{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 36px))}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

.deny{max-width:560px;margin:40px auto;text-align:center;padding:30px}
.deny svg.ic{width:36px;height:36px;color:var(--warn)}

.ap-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);align-items:start}
.ap-item:last-child{border-bottom:none}
.ap-item .idx{width:24px;height:24px;border-radius:50%;background:var(--neutral-soft);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.ap-item.ok .idx{background:var(--ok);color:#fff}
.ap-item.chg .idx{background:var(--warn);color:#fff}
.ap-item textarea{min-height:52px;margin-top:8px}
.ap-choice{display:flex;gap:6px}
.ap-choice label{display:flex;align-items:center;gap:6px;border:1px solid var(--border2);border-radius:7px;padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.ap-choice label.on-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.ap-choice label.on-chg{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}

.perm-yes{color:var(--ok);font-weight:700;text-align:center}
.perm-no{color:var(--border2);text-align:center}

@media (max-width:1200px){
  .pipeline{grid-template-columns:repeat(6,minmax(0,1fr))}

@media (max-width:560px){

@media print{

function totals(itemsArr,discount,custId,relaxKey='none'){
  const sub=itemsArr.reduce((a,i)=>a+Number(i.qty||0)*Number(i.rate||0),0);
  const disc=sub*Number(discount||0)/100, taxable=sub-disc;
  const relax=RELAX[relaxKey]||RELAX.none, same=intra(custId);
  const rate=relax.rate===null?18:relax.rate;
  const cg=same?taxable*rate/200:0, sg=cg, ig=same?0:taxable*rate/100;
  return {sub,disc,taxable,cg,sg,ig,rate,same,total:taxable+cg+sg+ig};
}
function comply(spec,val){
  const v=parseFloat(val); if(isNaN(v)||!spec) return '';
  let m;
  if(m=spec.match(/NMT\s*([\d.]+)/i)) return v<=+m[1]?'Complies':'Does not comply';
  if(m=spec.match(/Min\.?\s*([\d.]+)/i)) return v>=+m[1]?'Complies':'Does not comply';
  if(m=spec.match(/([\d.]+)\s*[–-]\s*([\d.]+)/)) return v>=+m[1]&&v<=+m[2]?'Complies':'Does not comply';
  return '';
}
function stats(vals){
  const v=vals.map(Number).filter(x=>!isNaN(x)&&x!==''); if(!v.length) return null;
  const avg=v.reduce((a,b)=>a+b,0)/v.length;
  const sd=v.length>1?Math.sqrt(v.reduce((a,b)=>a+(b-avg)**2,0)/(v.length-1)):0;
  return {n:v.length,avg,sd,rsd:avg?sd/avg*100:0};
}

function stepper(steps,cur,alias={}){

}

function badgeFor(r){
  switch(r){
    case 'enquiries':return S.enquiries.filter(e=>e.status==='New').length;
    case 'quotations':return S.quotes.filter(q=>['Draft','Internal Review'].includes(q.status)).length;
    case 'samples':return S.quotes.filter(q=>q.status==='Sent'||(q.status==='Accepted'&&!S.regs.some(x=>x.q===q.id))).length;
    case 'registration':return S.regs.filter(x=>x.status==='Pre-Registered').length;
    case 'section':return S.work.filter(w=>w.status==='Unassigned').length;
    case 'analyst':return S.work.filter(w=>w.analyst===analystUser()&&['Assigned','In Testing','Correction Required'].includes(w.status)).length;
    case 'review':return S.work.filter(w=>w.status==='Submitted for Review').length;
    case 'reports':return S.regs.filter(x=>x.report==='Preview').length;
    case 'dispatch':return S.regs.filter(x=>x.report==='Released').length+S.dispatch.filter(d=>!d.rcvDate).length;
    case 'stores':return S.stores.filter(s=>storeStatus(s)==='Due for Disposal').length;

  const rows=list.map(r=>{const c=cust(r.cust),p=secProgress(r.id),secs=r.status==='Pre-Registered'?r.tests.map(t=>t.section):Object.keys(p);

   `${ready.length?`<div class="mb8">${banner('info','info',`${ready.length} accepted quotation(s) with sample received are ready for pre-registration: ${ready.map(q=>`<a href="#/regnew/${q.id}">${q.id}</a>`).join(', ')}`)}</div>`:''}
   <div class="card mt"><div class="hd"><div class="seg">${tabs.map(t=>`<button class="${regTab===t?'on':''}" data-act="regTab" data-v="${t}">${t==='Pre-Registered'?'Pending review':t} <span class="faint">${t==='All'?S.regs.length:S.regs.filter(r=>r.status===t).length}</span></button>`).join('')}</div></div><div class="bd flush">${table(['Registration no.','Sample / customer','Template','Sections','Received','Progress','Status',''],rows)}</div></div>`);
};
let DRAFT=null;

   `<div class="card"><div class="bd">${stepper(['Awaiting Sample','Received','Pre-Registered','Registered'],'Received')}</div></div>
   <div class="split mt"><div class="stack">
    <div class="card"><div class="hd"><h2>Registration template</h2><div class="seg">${Object.keys(TEMPLATES).map(k=>`<button class="${DRAFT.template===k?'on':''}" data-act="dTpl" data-v="${k}">${k==='Mech'?'Mech':k}</button>`).join('')}</div></div>
     <div class="bd"><div class="small muted mb8">${T.desc}</div><div class="fgrid">
      <label class="f req"><span>Sample name</span><input value="${esc(DRAFT.sample)}" data-in="dField" data-k="sample"></label>
      <label class="f"><span>Quantity received</span><input value="${esc(DRAFT.qty)}" data-in="dField" data-k="qty" placeholder="e.g. 500 g / 3 specimens"></label>
      ${T.fields.map(f=>`<label class="f"><span>${f}</span><input value="${esc(DRAFT.fields[f]||'')}" data-in="dTplField" data-k="${esc(f)}"></label>`).join('')}
      <label class="f"><span>TAT</span><select data-in="dField" data-k="tat"><option ${DRAFT.tat==='Normal'?'selected':''}>Normal</option><option ${DRAFT.tat==='Urgent'?'selected':''}>Urgent</option></select></label>
      <label class="f"><span>Report delivery</span><select data-in="dField" data-k="delivery"><option>E-mail + hard copy</option><option>E-mail only</option><option>Hard copy only</option></select></label>
     </div></div></div>
    <div class="card"><div class="hd"><h2>Test group</h2><div class="row"><button class="btn sm" data-act="dCopy">${ic('copy')} Copy tests from quotation</button><select data-act-change="dAddTest" style="width:auto"><option value="">+ Add test…</option>${Object.entries(TESTS).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join('')}</select></div></div>

   </div>

    ${card('Section routing',DRAFT.tests.length?`<div class="small muted mb8">This sample will be forwarded to:</div>${[...new Set(DRAFT.tests.map(t=>t.section))].map(s=>`<div class="between" style="padding:5px 0"><span class="tag sec">${s}</span><span class="small">${DRAFT.tests.filter(t=>t.section===s).length} test(s)</span></div>`).join('')}`:'<div class="small muted">Add tests to see routing.</div>')}

R.reg=(id)=>{
  const r=reg(id); if(!r) return banner('bad','alert','Registration not found.');
  const q=quote(r.q),c=cust(r.cust),e=q.enq?S.enquiries.find(x=>x.id===q.enq):null;

  const fieldsDL=`<dl class="dl">${Object.entries(r.fields).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}<dt>Quantity</dt><dd>${esc(r.qty||'—')}</dd></dl>`;
  if(r.status==='Pre-Registered'){
    const ed=can('test.editMethod');
    const trows=r.tests.map((t,i)=>`<tr><td><b>${TESTS[t.code].name}</b></td><td><input value="${esc(t.method)}" data-in="rTest" data-i="${i}" data-k="method" ${ed?'':'disabled'}></td><td><input value="${esc(t.spec)}" data-in="rTest" data-i="${i}" data-k="spec" ${ed?'':'disabled'} style="width:110px"></td><td><select data-in="rTest" data-i="${i}" data-k="section" ${ed?'':'disabled'}>${SECTIONS.map(s=>`<option ${s===t.section?'selected':''}>${s}</option>`).join('')}</select></td></tr>`);
    const secs=[...new Set(r.tests.map(t=>t.section))];
    return page(`Registration review · ${r.pre}`,`${esc(r.sample)} · ${esc(c.name)} · template <b>${r.template}</b>`,
     `${gate('reg.approve',`<button class="btn" data-act="regReturn" data-id="${r.id}">${ic('undo')} Return to CRM</button>`)}${gate('reg.approve',`<button class="btn pri" data-act="regApprove" data-id="${r.id}">${ic('check')} Approve & register to ${secs.length} section(s)</button>`)}`,
     `<div class="card"><div class="bd">${stepper(['Awaiting Sample','Received','Pre-Registered','Registered'],'Pre-Registered')}</div></div>
     <div class="split mt"><div class="stack">
      ${card('Test group — verify tests & methods',table(['Test','Method','Specification','Section'],trows),ed?'<span class="small muted">Editable (authorized)</span>':'<span class="small muted">Read-only</span>',true)}
      ${card('Sample details ('+r.template+' template)',fieldsDL)}
     </div><div class="stack">
      ${card('On approval the system will',`<ol class="small" style="margin:0;padding-left:18px;line-height:1.8"><li>Generate a unique registration number</li><li>Register sample to ${secs.map(s=>`<span class="tag sec">${s}</span>`).join(' ')}</li><li>Notify each Section Approver</li><li>E-mail registration details to <b>${esc(c.contact)}</b> (${esc(c.email)})</li></ol>`)}
      ${card('Linked records',`<dl class="dl"><dt>Quotation</dt><dd><a href="#/quote/${q.id}">${q.id}</a></dd><dt>PO</dt><dd class="mono">${q.po.no}</dd><dt>Received</dt><dd>${fmt(r.received)}</dd><dt>Pre-registered by</dt><dd>Priya Sawant (CRM)</dd></dl>`)}
     </div></div>`);
  }
  const prog=secProgress(r.id);
  const chainNodes=[
   ['Customer',c.name,true],['Enquiry',e?e.id:'Direct',!!e||true],['Quotation',q.id,true],['PO',q.po?.no,!!q.po],['Sample receipt',fmt(q.receipt?.date),!!q.receipt],['Pre-registration',r.pre,true],['Registration',r.no,true],
   ['Testing',`${regWork(r.id).filter(w=>w.status==='Approved').length}/${regWork(r.id).length} approved`,allApproved(r.id)],['Report',r.report,['Released','Submitted/Dispatched'].includes(r.report)],['Dispatch',disp?disp.id:'—',!!disp],['Stores',st?storeStatus(st):'—',!!st],['Invoice',inv?inv.id:'—',!!inv]];
  const firstOpen=chainNodes.findIndex(n=>!n[2]);
  return page(`${r.no}`,`${esc(r.sample)} · ${esc(c.name)} · template <b>${r.template}</b> · registered ${fmt(r.regDate)}`,
   `<a class="btn" href="#/report/${r.id}">${ic('file')} Report</a>`,
   `${card('Traceability',`<div class="chain">${chainNodes.map((n,i)=>`${i?'<span class="arr">→</span>':''}<span class="node ${n[2]?'done':i===firstOpen?'cur':''}" title="${esc(n[1])}">${n[0]}<span class="xs" style="font-weight:400;display:block">${esc(n[1]||'')}</span></span>`).join('')}</div>`)}
   <div class="split mt"><div class="stack">
    ${Object.entries(prog).map(([s,p])=>card(`<span class="tag sec">${s}</span> &nbsp;${p.approved}/${p.total} approved`,table(['Test','Method','Analyst','Result','Status'],p.items.map(w=>`<tr><td><b>${TESTS[w.code].name}</b></td><td class="small">${esc(w.method)}</td><td>${w.analyst||'<span class="faint">Unassigned</span>'}</td><td>${w.result?`${esc(w.result)} ${w.unit}`:'—'}</td><td>${chip(w.status)}</td></tr>`)),`<span class="small muted">Approver: ${SEC_APPROVER[s]}</span>`,true)).join('')}
   </div><div class="stack">
    ${card('Sample details',fieldsDL)}
    ${card('Working data retention',`<div class="small">Raw data, observation sheets, images, chemical/standard & equipment usage, calculations and signatures for all tests are retained against this registration. <b>Only final results</b> appear in the customer report.</div>`)}
   </div></div>`);
};

    <div class="bd" style="border-bottom:1px solid var(--border);background:var(--panel2)"><div class="row"><span class="small"><b id="selCount">${secSel.size}</b> selected</span><select id="assignTo" style="width:auto">${ANALYSTS[SEC].map(a=>`<option>${a}</option>`).join('')}</select>${gate('sec.assign',`<button class="btn pri sm" data-act="assign">${ic('users')} Assign selected</button>`)}<span class="xs muted">The analyst receives an in-system notification.</span></div></div>

   <div class="grid g2 mt">${ANALYSTS[SEC].map(a=>{const mine=S.work.filter(w=>w.analyst===a);return card(a,`<div class="row">${['Assigned','In Testing','Correction Required','Submitted for Review','Approved'].map(s=>`<span class="small">${chip(s)} ${mine.filter(w=>w.status===s).length}</span>`).join('')}</div>`)}).join('')}</div>`);

   <div class="card mt"><div class="bd flush">${table(['Work ID','Registration','Test','TAT due','Result','Status'],rows,'No assignments for this analyst.')}</div></div>`);
};
function analystWork(w){

  return page(`${t.name}`,`${w.id} · <a href="#/reg/${r.id}">${r.no}</a> · ${esc(r.sample)} · ${esc(cust(r.cust).name)}`,
   locked?`<span class="small muted">${ic('lock')} ${w.status==='Approved'?'Approved — read only':can('test.enter')?'Submitted — read only':'Read only for your role'}</span>`:`<button class="btn" data-act="wSave">Save draft</button><button class="btn pri" data-act="wSubmit">${ic('arrow')} Submit for review</button>`,
   `<div class="card"><div class="bd">${stepper(['Assigned','In Testing','Submitted for Review','Approved'],w.status,{'Correction Required':'In Testing'})}</div></div>
   ${w.status==='Correction Required'?`<div class="mt">${banner('bad','undo',`<b>Returned for correction</b> by ${SEC_APPROVER[w.section]}: “${esc(w.returnNote)}”`)}</div>`:''}
   <div class="mt">${banner('info','info','<b>Data rule:</b> only the <b>final result</b> is carried into the customer report. All other working data on this screen is retained against registration '+r.no+'.')}</div>
   <div class="split mt"><div class="card"><div class="tabs" role="tablist">${['Observations','Instrument data','Chemicals & standards','Equipment','Calculation & result','Remarks & signature'].map((x,i)=>`<button class="${i===0?'on':''}" data-act="tab" data-i="${i}">${x}</button>`).join('')}</div>
    <div class="tabpane on">
     <div class="between mb8"><h3>Reading sheet — replicate values</h3><label class="row small">Replicates <select data-in="wReps" ${dis} style="width:auto">${[1,2,3,4,5].map(n=>`<option ${n===w.reps?'selected':''}>${n}</option>`).join('')}</select></label></div>
     <div class="fgrid c3">${valInputs}</div>
     <div class="grid g4 mt" id="statsbox">${statsHTML(w)}</div>

    </div>
    <div class="tabpane">
     <label class="drop ${locked?'locked':''}">${ic('upload')}<div class="mt8"><b>Upload images, peaks or graphs</b></div><div class="small">Copied from instrument PC — PNG, JPG, PDF exports</div><input type="file" accept="image/*" multiple data-act-change="wFiles" ${dis} hidden></label>
     <div class="thumbs">${w.files.map(f=>`<div class="thumb"><div class="img">${f.svg?chromSVG():`<img src="${f.url}" alt="">`}</div><div class="cap"><span>${esc(f.name)}</span></div></div>`).join('')||'<div class="small muted">No attachments yet.</div>'}</div>
    </div>
    <div class="tabpane">${usageTable(w,'chem',['name','grade','lot','exp','qty'],['Chemical / standard','Grade','Lot no.','Expiry','Qty used'],locked)}</div>

    <div class="tabpane">
     <div class="card" style="background:var(--panel2)"><div class="bd"><div class="small muted">Formula applied</div><div style="font-size:16px;font-weight:600;margin-top:4px">${F?F.expr:'Result = Average of replicate values'}</div></div></div>
     ${F?`<div class="fgrid c3 mt">${F.vars.map(([k,l])=>`<label class="f"><span>${l}</span><input type="number" step="any" value="${w.calc[k]}" data-in="wCalc" data-k="${k}" ${dis}></label>`).join('')}</div>`:''}

     <div class="fgrid mt">
      <label class="f req"><span>Final result (goes to report)</span><input value="${esc(w.result)}" data-in="wField" data-k="result" ${dis} style="font-weight:700;font-size:15px"></label>

    </div>

   </div></div>`);
}
function statsHTML(w){const s=stats(w.values);return [['Readings',s?s.n:'—'],['Average',s?round(s.avg,3):'—'],['Std. dev.',s?round(s.sd,4):'—'],['% RSD',s?round(s.rsd,2):'—']].map(([l,v])=>`<div class="card" style="padding:10px 12px;background:var(--panel2)"><div class="xs muted">${l}</div><div style="font-weight:650;font-size:17px">${v}</div></div>`).join('')}
function usageTable(w,key,cols,heads,locked){
  const rows=w[key].map((x,i)=>`<tr>${cols.map(c=>`<td><input value="${esc(x[c]||'')}" data-in="wRow" data-t="${key}" data-i="${i}" data-k="${c}" ${locked?'disabled':''}></td>`).join('')}<td>${locked?'':`<button class="btn sm ghost" data-act="wRowDel" data-t="${key}" data-i="${i}" aria-label="Remove">${ic('trash')}</button>`}</td></tr>`);
  return `<div class="between mb8"><h3>Chemical & standard usage</h3>${locked?'':`<button class="btn sm" data-act="wRowAdd" data-t="${key}">${ic('plus')} Add row</button>`}</div>${table([...heads,''],rows,'No chemicals / standards recorded.')}`;
}
function equipTable(w,locked){
  const rows=w.equip.map((x,i)=>{const e=EQUIP.find(e=>e[0]===x.id)||['','',''];return `<tr><td><select data-in="wRow" data-t="equip" data-i="${i}" data-k="id" ${locked?'disabled':''}>${EQUIP.map(q=>`<option value="${q[0]}" ${q[0]===x.id?'selected':''}>${q[0]} · ${q[1]}</option>`).join('')}</select></td><td class="small">${e[2]}</td><td><input type="time" value="${x.from||''}" data-in="wRow" data-t="equip" data-i="${i}" data-k="from" ${locked?'disabled':''}></td><td><input type="time" value="${x.to||''}" data-in="wRow" data-t="equip" data-i="${i}" data-k="to" ${locked?'disabled':''}></td><td>${locked?'':`<button class="btn sm ghost" data-act="wRowDel" data-t="equip" data-i="${i}" aria-label="Remove">${ic('trash')}</button>`}</td></tr>`});
  return `<div class="between mb8"><h3>Equipment usage</h3>${locked?'':`<button class="btn sm" data-act="wRowAdd" data-t="equip">${ic('plus')} Add equipment</button>`}</div>${table(['Equipment','Calibration due','Start','End',''],rows,'No equipment usage recorded.')}<div class="xs muted mt8">Equipment with expired calibration will be blocked from selection (master data rule).</div>`;
}
function chromSVG(w=300,h=120,peaks=[[1.6,22,.07],[3.4,100,.09],[5.2,12,.08],[6.8,34,.1]]){
  let d='';for(let x=0;x<=8;x+=.04){let y=2+Math.sin(x*3)*0.6;peaks.forEach(([m,a,s])=>y+=a*Math.exp(-((x-m)**2)/(2*s*s)));d+=`${x?'L':'M'}${(x/8*(w-30)+24).toFixed(1)} ${(h-18-y*(h-30)/105).toFixed(1)}`}
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" role="img" aria-label="Chromatogram"><path d="M24 8V${h-18}H${w-6}" fill="none" stroke="currentColor" stroke-opacity=".4"/><path d="${d}" fill="none" stroke="#0d8a84" stroke-width="1.4"/>${peaks.map(([m,a])=>`<text x="${(m/8*(w-30)+24).toFixed(0)}" y="${(h-22-a*(h-30)/105).toFixed(0)}" font-size="8" text-anchor="middle" fill="currentColor">${m.toFixed(1)}</text>`).join('')}<text x="${w-6}" y="${h-5}" font-size="8" text-anchor="end" fill="currentColor" opacity=".6">min</text><text x="4" y="12" font-size="8" fill="currentColor" opacity=".6">mAU</text></svg>`;
}

/* ============================ REVIEW & APPROVAL ============================ */
R.review=(wid)=>{
  if(wid) return reviewDetail(wk(wid));
  const pend=S.work.filter(w=>w.status==='Submitted for Review');
  const hist=S.work.filter(w=>['Approved','Correction Required'].includes(w.status)&&w.reviewedBy).slice(0,8);
  const row=w=>{const r=reg(w.reg);return `<tr class="click" data-act="go" data-r="review/${w.id}"><td><span class="mono">${r.id}</span><div class="xs muted">${esc(r.sample)}</div></td><td><b>${TESTS[w.code].name}</b></td><td><span class="tag sec">${w.section}</span></td><td>${esc(w.analyst)}</td><td>${w.result} ${w.unit} ${chip(comply(w.spec,w.result))}</td><td>${chip(w.status)}</td></tr>`};
  return page('Review & approval','Section Reviewer / Approver verifies observations, calculations, attachments, usage and final result — then approves or returns to the analyst.','',
   `${card(`Pending review <span class="tag">${pend.length}</span>`,table(['Registration','Test','Section','Analyst','Result','Status'],pend.map(row),'Nothing waiting for review.'),'',true)}
   <div class="mt">${card('Recently reviewed',table(['Registration','Test','Section','Analyst','Result','Status'],S.work.filter(w=>w.status==='Correction Required').concat(S.work.filter(w=>w.status==='Approved').slice(0,6)).map(row)),'',true)}</div>`);
};
function reviewDetail(w){
  if(!w) return banner('bad','alert','Item not found.');
  const r=reg(w.reg),t=TESTS[w.code],s=stats(w.values);
  const active=w.status==='Submitted for Review'&&can('test.review');
  const checks=['Observations & raw data verified','Calculations verified','Attachments / images / peaks verified','Equipment & chemical / standard details verified','Final result verified against specification'];
  return page(`Review · ${t.name}`,`${w.id} · <a href="#/reg/${r.id}">${r.no}</a> · analyst ${esc(w.analyst)}`,
   active?`<button class="btn danger" data-act="rvReturn">${ic('undo')} Return for correction</button><button class="btn ok" data-act="rvApprove">${ic('check')} Approve data</button>`:`<span class="small muted">${ic('lock')} ${w.status==='Submitted for Review'?'Only reviewers/approvers can act here':'Review completed'}</span>`,
   `<div class="card"><div class="bd">${stepper(['Assigned','In Testing','Submitted for Review','Approved'],w.status,{'Correction Required':'In Testing'})}</div></div>
   <div class="split mt"><div class="stack">
    ${card('Result',`<div class="grid g4"><div><div class="xs muted">Final result</div><div style="font-size:22px;font-weight:700">${esc(w.result||'—')} <span class="small">${t.unit}</span></div></div><div><div class="xs muted">Specification</div><div style="font-weight:600;margin-top:4px">${esc(w.spec)}</div></div><div><div class="xs muted">Compliance</div><div class="mt8">${chip(comply(w.spec,w.result))}</div></div><div><div class="xs muted">Replicates · %RSD</div><div style="font-weight:600;margin-top:4px">${w.values.join(', ')||'—'} · ${s?round(s.rsd,2):'—'}</div></div></div>`)}
    ${card('Raw data & observations',`<div class="small">${esc(w.raw)||'<span class="faint">None recorded</span>'}</div>${w.files.length?`<div class="thumbs">${w.files.map(f=>`<div class="thumb"><div class="img">${f.svg?chromSVG():`<img src="${f.url}" alt="">`}</div><div class="cap">${esc(f.name)}</div></div>`).join('')}</div>`:''}`)}
    <div class="grid g2">${card('Chemicals & standards',table(['Name','Lot','Qty'],w.chem.map(c=>`<tr><td>${esc(c.name)}</td><td class="mono">${esc(c.lot)}</td><td>${esc(c.qty)}</td></tr>`),'None recorded'),'',true)}${card('Equipment',table(['ID','Name','Used'],w.equip.map(e=>{const q=EQUIP.find(x=>x[0]===e.id)||[];return `<tr><td class="mono">${e.id}</td><td class="small">${q[1]||''}</td><td class="small">${e.from}–${e.to}</td></tr>`}),'None recorded'),'',true)}</div>
    ${card('Remarks & signature',`<div class="small">${esc(w.remarks)||'<span class="faint">No remarks</span>'}</div><div class="sig mt ${w.signed?'done':''}">${w.signed?`<b>Signed by ${esc(w.signed.by)}</b> <span class="small">${w.signed.at}</span>`:'<span class="small muted">Not signed</span>'}</div>`)}
   </div><div class="stack" style="position:sticky;top:76px">
    ${card('Verification checklist',checks.map((c,i)=>`<label style="display:flex;gap:8px;padding:5px 0;font-size:13px"><input type="checkbox" class="rvchk" ${active?'':'disabled'} ${w.status==='Approved'?'checked':''}> ${c}</label>`).join('')+`<label class="f mt"><span>Reviewer comment ${active?'(required when returning)':''}</span><textarea id="rvNote" ${active?'':'disabled'}>${esc(w.status==='Correction Required'?w.returnNote:w.reviewNote)}</textarea></label>${w.reviewedBy&&!active?`<div class="small muted mt8">Reviewed by ${esc(w.reviewedBy)}</div>`:''}`)}
   </div></div>`);
}

/* ============================ REPORTS ============================ */
R.reports=()=>{
  const list=S.regs.filter(r=>r.status==='Registered');
  const rows=list.map(r=>{const p=secProgress(r.id);return `<tr class="click" data-act="go" data-r="report/${r.id}"><td><span class="mono">${r.no}</span></td><td><b>${esc(r.sample)}</b><div class="xs muted">${esc(cust(r.cust).name)}</div></td><td>${Object.entries(p).map(([s,x])=>`<div class="row" style="flex-wrap:nowrap;margin:2px 0"><span class="tag sec" style="min-width:92px">${s}</span><div class="progress ${x.approved===x.total?'ok':''}" style="width:80px"><i style="width:${x.approved/x.total*100}%"></i></div><span class="xs muted">${x.approved}/${x.total}</span></div>`).join('')}</td><td>${Object.keys(p).length>1?'<span class="tag">Combined</span>':'<span class="tag">Single section</span>'}</td><td>${chip(r.report)}</td></tr>`});
  return page('Report management','Reports are generated only from approved final results. Multi-section registrations produce one combined report once every section is complete.','',
   card('',table(['Registration','Sample / customer','Section completion','Type','Report status'],rows),'',true));
};
const RTYPES={final:'Final result – numerical / text',multi:'Multiple values (2–5) + average',visual:'Instrument / visual result',book:'Validation / verification (book-style)'};
R.report=(id)=>{
  const r=reg(id); if(!r) return banner('bad','alert','Registration not found.');
  const p=secProgress(r.id),done=allApproved(r.id);
  const pending=Object.entries(p).filter(([,x])=>x.approved<x.total);
  const released=['Released','Submitted/Dispatched'].includes(r.report);
  const cc=r.custEdit||{...cust(r.cust)};
  const ed=can('report.editCustomer')&&!released;
  return page(`Test report · ${r.no}`,`${esc(r.sample)} · ${esc(cust(r.cust).name)}`,
   `<button class="btn" data-act="print">${ic('print')} Print / PDF</button>${released?'':gate('report.release',`<button class="btn pri" data-act="release" ${done?'':'disabled title="All sections must be approved first"'}>${ic('check')} Release report</button>`)}`,
   `<div class="card"><div class="bd">${stepper(['Draft','Preview','Released','Submitted/Dispatched'],r.report)}</div></div>
   ${!done?`<div class="mt">${banner('warn','alert',`<b>Combined report awaiting completion.</b> Pending: ${pending.map(([s,x])=>`${s} (${x.total-x.approved} test${x.total-x.approved>1?'s':''})`).join(', ')}. Release is blocked until every section is approved. <button class="btn sm" data-act="nudge" style="margin-left:6px">${ic('bell')} Notify pending sections</button>`)}</div>`:''}
   <div class="split-l mt"><div class="stack noprint">
    ${card('Report options',`<div class="small muted mb8" style="font-weight:600">Report type</div>${Object.entries(RTYPES).map(([k,l])=>`<label style="display:flex;gap:8px;padding:4px 0;font-size:13px"><input type="radio" name="rtype" data-act="rOpt" data-k="reportType" data-v="${k}" ${r.reportType===k?'checked':''} ${released?'disabled':''}> ${l}</label>`).join('')}
     <div class="mt" style="border-top:1px solid var(--border);padding-top:12px"><label class="between small" style="padding:4px 0">With NABL symbol <input type="checkbox" data-act="rOpt" data-k="nabl" ${r.nabl?'checked':''} ${released?'disabled':''}></label><label class="between small" style="padding:4px 0">With specification limits <input type="checkbox" data-act="rOpt" data-k="spec" ${r.spec?'checked':''} ${released?'disabled':''}></label></div>`)}
    ${card('Customer details on report',`<div class="fgrid" style="grid-template-columns:1fr">${[['name','Customer name'],['contact','Contact person'],['city','City'],['state','State']].map(([k,l])=>`<label class="f"><span>${l}</span><input value="${esc(cc[k])}" data-in="rCust" data-k="${k}" ${ed?'':'disabled'}></label>`).join('')}</div><div class="xs muted mt8">${ed?'Authorized approver may correct customer details before final generation.':'Editable only by the Section Approver before release.'}</div>`)}
    ${card('Section sign-off',Object.entries(p).map(([s,x])=>`<div class="between" style="padding:5px 0"><span class="tag sec">${s}</span>${x.approved===x.total?chip('Approved'):chip('Pending')}</div>`).join(''))}
   </div>
   <div class="paperwrap"><div class="paper print-area" id="paper">${paperHTML(r)}</div></div></div>`);
};
function paperHTML(r){
  const c=r.custEdit||cust(r.cust),ws=regWork(r.id),q=quote(r.q);
  const type=r.reportType,showSpec=r.spec,nabl=r.nabl;
  const anyNon=ws.some(w=>!TESTS[w.code].nabl);
  const done=allApproved(r.id);
  const res=w=>w.status==='Approved'?esc(w.result):'<i style="color:#a15c00">Pending</i>';
  const tn=w=>TESTS[w.code].name+(nabl&&!TESTS[w.code].nabl?' *':'');
  let body='';
  if(type==='multi'){
    const n=Math.max(2,...ws.map(w=>w.values.length));
    body=`<table><thead><tr><th>#</th><th>Test</th><th>Method</th>${Array.from({length:n},(_,i)=>`<th>V${i+1}</th>`).join('')}<th>Average</th><th>Unit</th>${showSpec?'<th>Specification</th>':''}</tr></thead><tbody>${ws.map((w,i)=>`<tr><td>${i+1}</td><td>${tn(w)}</td><td>${esc(w.method)}</td>${Array.from({length:n},(_,j)=>`<td>${w.status==='Approved'&&w.values[j]!=null?w.values[j]:''}</td>`).join('')}<td><b>${res(w)}</b></td><td>${w.unit}</td>${showSpec?`<td>${esc(w.spec)}</td>`:''}</tr>`).join('')}</tbody></table>`;
  } else {
    body=`<table><thead><tr><th>#</th><th>Test parameter</th><th>Method</th><th>Result</th><th>Unit</th>${showSpec?'<th>Specification</th><th>Remark</th>':''}</tr></thead><tbody>${ws.map((w,i)=>`<tr><td>${i+1}</td><td>${tn(w)}</td><td>${esc(w.method)}</td><td><b>${res(w)}</b></td><td>${w.unit}</td>${showSpec?`<td>${esc(w.spec)}</td><td>${w.status==='Approved'?comply(w.spec,w.result):''}</td>`:''}</tr>`).join('')}</tbody></table>`;
  }
  if(type==='visual') body+=`<div class="sect">Instrument data</div>${ws.slice(0,2).map((w,i)=>`<div class="fig">${chromSVG(640,170)}<div class="cap">Figure ${i+1}: ${TESTS[w.code].name} — chromatogram / instrument output copied from instrument PC</div></div>`).join('')}`;
  if(type==='book'){
    const vals=ws[0]?.values?.length?ws[0].values:[99.2,99.6,99.8,99.5,99.7];
    const W=640,H=150,mn=Math.min(...vals)-0.6,mx=Math.max(...vals)+0.6;
    const pts=vals.map((v,i)=>[40+i*(W-60)/Math.max(1,vals.length-1),H-20-(v-mn)/(mx-mn)*(H-40)]);
    body=`<div class="sect">Contents</div><ol class="toc"><li>Objective & scope</li><li>Summary of results</li><li>Trend of replicate results</li><li>Instrument data</li><li>Conclusion</li></ol>
     <div class="sect">1. Objective & scope</div><p>To verify the analytical performance of the stated methods for ${esc(r.sample)} as requested under quotation ${q.id}.</p>
     <div class="sect">2. Summary of results</div>${body}
     <div class="sect">3. Trend of replicate results</div><div class="fig"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Trend"><path d="M40 10V${H-20}H${W-10}" fill="none" stroke="#999"/><polyline points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#0d8a84" stroke-width="2"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#0d8a84"/><text x="${p[0]}" y="${p[1]-8}" font-size="10" text-anchor="middle">${vals[i]}</text>`).join('')}</svg><div class="cap">Figure 1: Replicate results — ${ws[0]?TESTS[ws[0].code].name:''}</div></div>
     <div class="sect">4. Instrument data</div><div class="fig">${chromSVG(640,160)}<div class="cap">Figure 2: Representative chromatogram</div></div>
     <div class="sect">5. Conclusion</div><p>${done?'All parameters were evaluated and results are reported above.':'<i>To be completed after all sections are approved.</i>'}</p>`;
  }
  const f=Object.entries(r.fields);
  return `<div class="phd"><div class="plogo"><div class="logo">LL</div><div><b>LUCID LABS</b><span style="font-size:10.5px;color:#555">${LAB.addr} · GSTIN ${LAB.gst}</span></div></div>${nabl?`<div style="text-align:center"><div class="nabl">NABL<small>TC-XXXX</small></div></div>`:''}</div>
  <h2>${type==='book'?'VALIDATION / VERIFICATION REPORT':'TEST REPORT'}</h2>
  <table class="kv"><tbody><tr><td>Report No.</td><td>${r.no.replace('REG','TR')}</td><td style="width:18%;background:#f6f8f9;font-weight:600">Issue date</td><td>${['Released','Submitted/Dispatched'].includes(r.report)?fmt(r.releasedOn||TODAY):'<i>on release</i>'}</td></tr>
  ${nabl?`<tr><td>ULR No.</td><td colspan="3">TC-XXXX-26-XXXXXXXXF <span style="color:#777">(format to be confirmed)</span></td></tr>`:''}
  <tr><td>Customer</td><td colspan="3"><b>${esc(c.name)}</b>, ${esc(c.city)}, ${esc(c.state)}<br>Kind attn: ${esc(c.contact)}</td></tr>
  <tr><td>Customer ref.</td><td>PO ${q.po?.no||'—'} dt. ${fmt(q.po?.date)}</td><td style="background:#f6f8f9;font-weight:600">Quotation</td><td>${q.id}</td></tr></tbody></table>
  <div class="sect">Sample details</div>
  <table class="kv"><tbody><tr><td>Sample name</td><td colspan="3"><b>${esc(r.sample)}</b></td></tr>${f.reduce((a,[k,v],i)=>i%2?a:a+`<tr><td>${esc(k)}</td><td>${esc(v)}</td>${f[i+1]?`<td style="background:#f6f8f9;font-weight:600;width:18%">${esc(f[i+1][0])}</td><td>${esc(f[i+1][1])}</td>`:'<td></td><td></td>'}</tr>`,'')}
  <tr><td>Received on</td><td>${fmt(r.received)}</td><td style="background:#f6f8f9;font-weight:600">Analysis period</td><td>${fmt(r.regDate)} – ${done?fmt(TODAY):'…'}</td></tr></tbody></table>
  ${type==='book'?body:`<div class="sect">Results</div>${body}`}
  <p style="font-size:10.5px;color:#444;margin-top:10px">${nabl&&anyNon?'* Parameter not covered under NABL scope of accreditation.<br>':''}Results relate only to the sample tested. This report shall not be reproduced except in full without written approval of Lucid Labs.</p>
  <div class="foot"><div>Reviewed by<br><b>${[...new Set(ws.map(w=>SEC_APPROVER[w.section]))].join(', ')}</b></div><div>Authorized Signatory<br><b>${['Released','Submitted/Dispatched'].includes(r.report)?'Dr. Meera Rao':'&nbsp;'}</b></div></div>
  <div class="eor">— End of report —</div>`;
}

/* ============================ DISPATCH ============================ */
R.dispatch=()=>{
  const ready=S.regs.filter(r=>r.report==='Released');
  const rows=ready.map(r=>`<tr><td class="mono">${r.no}</td><td><b>${esc(cust(r.cust).name)}</b><div class="xs muted">${esc(r.sample)}</div></td><td>Test report${invFor(r.id)?' + Tax invoice':''}</td><td>${Object.keys(secProgress(r.id)).length>1?'<span class="tag">Combined</span>':'—'}</td><td>${chip('Ready to dispatch')}</td><td>${gate('dispatch.record',`<button class="btn sm pri" data-act="dispatchNew" data-id="${r.id}">${ic('truck')} Record dispatch</button>`)}</td></tr>`);
  const hist=S.dispatch.map(d=>`<tr><td class="mono">${d.id}</td><td><a href="#/reg/${d.reg}" class="mono">${d.reg}</a><div class="xs muted">${esc(cust(reg(d.reg)?.cust||'C1').name)}</div></td><td class="small">${esc(d.docs)}</td><td>${fmt(d.date)}<div class="xs muted">by ${esc(d.by)}</div></td><td class="small">${esc(d.courier)}<div class="mono xs">${esc(d.awb)}</div></td><td>${d.rcvDate?`${fmt(d.rcvDate)}<div class="xs muted">${esc(d.rcvBy)}</div>`:'—'}</td><td>${chip(d.rcvDate?'Delivered':'In Transit')}</td><td>${d.rcvDate?'':gate('dispatch.record',`<button class="btn sm" data-act="dispatchRcv" data-id="${d.id}">Confirm receipt</button>`)}</td></tr>`);
  return page('Customer submission & dispatch','Final report submission and hard-copy dispatch of reports and invoices, with courier and receipt confirmation at the customer end.','',
   `${card('Ready to dispatch',table(['Registration','Customer / sample','Documents','Report','Status',''],rows,'No released reports waiting for dispatch.'),'',true)}<div class="mt">${card('Dispatch register',table(['Dispatch','Registration','Documents','Dispatched','Courier / AWB','Received at customer','Status',''],hist),'',true)}</div>`);
};

/* ============================ STORES ============================ */
R.stores=()=>{
  const pendingIn=S.regs.filter(r=>['Released','Submitted/Dispatched'].includes(r.report)&&!S.stores.some(s=>s.reg===r.id));
  const rows=S.stores.map(s=>{const st=storeStatus(s);return `<tr><td class="mono">${s.id}</td><td><span class="mono">${s.reg}</span><div class="xs muted">${esc(s.sample)}</div></td><td>${fmt(s.inDate)}<div class="xs muted">${esc(s.inBy)}</div></td><td>${s.loc}</td><td>${s.retVal} ${s.retUnit}</td><td>${fmt(plannedDisposal(s))}</td><td>${s.actual?`${fmt(s.actual)}<div class="xs muted">${esc(s.method)} · ${esc(s.by)}</div>`:'—'}</td><td>${chip(st)}</td><td>${s.actual?'':gate('stores.manage',`<button class="btn sm ${st==='Due for Disposal'?'pri':''}" data-act="dispose" data-id="${s.id}">Record disposal</button>`)}</td></tr>`});
  return page('Stores · remnant sample retention','Remnant samples received after testing, retained for the defined period and disposed with method and responsible person recorded.','',
   `<div class="grid g4">${['In Store','Retention Active','Due for Disposal','Disposed'].map(k=>`<div class="card kpi"><div class="l">${k}</div><div class="v">${k==='In Store'?S.stores.filter(s=>!s.actual).length:S.stores.filter(s=>storeStatus(s)===k).length}</div></div>`).join('')}</div>
   ${pendingIn.length?`<div class="mt">${card('Awaiting receipt in store',table(['Registration','Sample','Customer',''],pendingIn.map(r=>`<tr><td class="mono">${r.no}</td><td>${esc(r.sample)}</td><td>${esc(cust(r.cust).name)}</td><td>${gate('stores.manage',`<button class="btn sm pri" data-act="storeIn" data-id="${r.id}">Receive remnant</button>`)}</td></tr>`)),'',true)}</div>`:''}
   <div class="mt">${card('Retention register',table(['Store ID','Registration / sample','Received in store','Location','Retention','Planned disposal','Actual disposal','Status',''],rows),'',true)}</div>`);
};

/* ============================ INVOICES ============================ */
R.invoices=()=>{
  const toMake=S.regs.filter(r=>['Released','Submitted/Dispatched'].includes(r.report)&&!invFor(r.id));
  const rows=S.invoices.map(i=>{const r=reg(i.reg),t=totals(i.items,i.discount,r.cust,i.relax);return `<tr class="click" data-act="go" data-r="invoice/${i.id}"><td class="mono">${i.id}</td><td>${fmt(i.date)}</td><td><b>${esc(cust(r.cust).name)}</b><div class="xs muted">${r.no}</div></td><td class="num">${inr(t.total)}</td><td class="num">${inr(t.total-i.advance)}</td><td>${chip(i.status)}</td></tr>`});
  return page('Tax invoices','Invoices raised against registration / quotation / PO with GST, tax relaxations, advance payment and authorized signature.','',
   `${toMake.length?card('Released reports without invoice',table(['Registration','Customer','Quotation / PO',''],toMake.map(r=>{const q=quote(r.q);return `<tr><td class="mono">${r.no}</td><td>${esc(cust(r.cust).name)}</td><td class="small">${q.id} · PO ${q.po?.no}</td><td>${gate('invoice.edit',`<button class="btn sm pri" data-act="invNew" data-id="${r.id}">${ic('plus')} Prepare invoice</button>`)}</td></tr>`})),'',true)+'<div class="mt"></div>':''}
   ${card('Invoice register',table(['Invoice','Date','Customer','#Invoice value','#Balance due','Status'],rows),'',true)}`);
};
R.invoice=(id)=>{
  const i=S.invoices.find(x=>x.id===id); if(!i) return banner('bad','alert','Invoice not found.');
  const r=reg(i.reg),q=quote(r.q),c=cust(r.cust);
  const ed=can('invoice.edit')&&i.status==='Draft';const dis=ed?'':'disabled';
  let act='';
  if(i.status==='Draft') act=gate('invoice.authorize',`<button class="btn pri" data-act="invStatus" data-v="Approved">${ic('sign')} Approve & sign</button>`);
  if(i.status==='Approved') act=gate('invoice.edit',`<button class="btn pri" data-act="invStatus" data-v="Issued">${ic('mail')} Issue to customer</button>`);
  if(i.status==='Issued') act=gate('dispatch.record',`<button class="btn" data-act="invStatus" data-v="Dispatched">${ic('truck')} Mark hard copy dispatched</button>`);
  const rows=i.items.map((it,k)=>`<tr><td><input value="${esc(it.desc)}" data-in="iItem" data-i="${k}" data-k="desc" ${dis}></td><td class="small">${esc(it.method)}</td><td><input type="number" value="${it.qty}" data-in="iItem" data-i="${k}" data-k="qty" ${dis} style="width:64px"></td><td><input type="number" value="${it.rate}" data-in="iItem" data-i="${k}" data-k="rate" ${dis} style="width:90px"></td><td class="num" id="iamt${k}">${inr(it.qty*it.rate)}</td></tr>`);
  return page(`Tax invoice ${i.id}`,`${esc(c.name)} · ${r.no} · quotation ${q.id} · PO ${q.po?.no}`,`<button class="btn" data-act="print">${ic('print')} Print / PDF</button>${act}`,
   `<div class="card"><div class="bd">${stepper(['Draft','Approved','Issued','Dispatched'],i.status)}</div></div>
   <div class="split mt"><div class="stack">
    ${card('Customer & references',`<div class="fgrid c3"><label class="f"><span>Customer</span><input value="${esc(c.name)}" readonly></label><label class="f"><span>Customer GSTIN</span><input value="${c.gst}" readonly class="mono"></label><label class="f"><span>Place of supply</span><input value="${c.state}" readonly></label><label class="f"><span>Registration</span><input value="${r.no}" readonly class="mono"></label><label class="f"><span>Sample</span><input value="${esc(r.sample)}" readonly></label><label class="f"><span>Invoice date</span><input type="date" value="${i.date}" ${dis}></label></div>`)}
    ${card('Test charges',table(['Description','Method','Qty','Rate (₹)','#Amount'],rows),'',true)}
    <div class="grid g2">
     ${card('Tax relaxation & advance',`<label class="f"><span>Applicable tax relaxation</span><select data-in="iRelax" ${dis}>${Object.entries(RELAX).map(([k,v])=>`<option value="${k}" ${i.relax===k?'selected':''}>${v.label}</option>`).join('')}</select></label><label class="f mt"><span>Advance payment received (₹)</span><input type="number" value="${i.advance}" data-in="iAdv" ${dis}></label><label class="f mt"><span>Discount (%)</span><input type="number" value="${i.discount}" data-in="iDisc" ${dis}></label>`)}
     ${card('Bank details & authorization',`<dl class="dl"><dt>Bank</dt><dd>${LAB.bank.name}</dd><dt>A/c no.</dt><dd>${LAB.bank.ac}</dd><dt>IFSC</dt><dd>${LAB.bank.ifsc}</dd></dl><div class="sig mt ${i.signedBy?'done':''}">${i.signedBy?`<b>${ic('sign')} Signed</b><div class="small">${esc(i.signedBy)} · Authorized Signatory</div>`:'<span class="small muted">Awaiting authorized signature</span>'}</div>`)}
    </div>
   </div><div class="card" style="position:sticky;top:76px"><div class="hd"><h2>Invoice summary</h2></div><div class="bd" id="itotals">${invTotalsHTML(i)}</div></div></div>`);
};
function invTotalsHTML(i){
  const r=reg(i.reg),q=quote(r.q),t=totals(i.items,i.discount,r.cust,i.relax);
  const over=q.po&&t.total>q.po.value+1;
  return `<div class="sumrow"><span>Sub-total</span><span>${inr(t.sub)}</span></div><div class="sumrow"><span>Discount ${i.discount}%</span><span>− ${inr(t.disc)}</span></div><div class="sumrow"><span>Taxable value</span><span>${inr(t.taxable)}</span></div>
  ${t.same?`<div class="sumrow"><span>CGST ${t.rate/2}%</span><span>${inr(t.cg)}</span></div><div class="sumrow"><span>SGST ${t.rate/2}%</span><span>${inr(t.sg)}</span></div>`:`<div class="sumrow"><span>IGST ${t.rate}%</span><span>${inr(t.ig)}</span></div>`}
  <div class="sumrow total"><span>Invoice value</span><span>${inr(t.total)}</span></div><div class="sumrow"><span>Less: advance</span><span>− ${inr(i.advance)}</span></div><div class="sumrow" style="font-weight:700"><span>Balance due</span><span>${inr(t.total-i.advance)}</span></div>
  <div class="small muted mt8">PO value: ${q.po?inr(q.po.value):'—'}</div>${over?`<div class="mt8">${banner('warn','alert','Invoice value exceeds PO value — confirm with customer.')}</div>`:''}`;
}

  card('',myNotes().map(n=>`<div class="list-item ${n.read?'read':''}" style="cursor:pointer" data-act="note" data-id="${n.id}"><span class="dotc"></span><div style="flex:1">${esc(n.text)}<div class="xs faint">${n.at}</div></div>${ic('arrow','faint')}</div>`).join('')||'<div class="empty">No notifications.</div>','',true));
R.roles=()=>{
  const ks=Object.keys(ROLES).filter(k=>k!=='admin');
  return page('Roles & permissions','Permission matrix derived from the approval boundaries in the workflow document. Use the role switcher to experience each view.','',
   `${card('',`<div class="table-wrap"><table class="t"><thead><tr><th>Permission</th>${ks.map(k=>`<th style="text-align:center;white-space:normal;min-width:88px">${ROLES[k].label}</th>`).join('')}</tr></thead><tbody>${Object.entries(PERMS).map(([p,l])=>`<tr><td>${l}</td>${ks.map(k=>ROLES[k].perms.includes(p)?'<td class="perm-yes">✓</td>':'<td class="perm-no">·</td>').join('')}</tr>`).join('')}</tbody></table></div>`,'',true)}
   <div class="mt">${card('Approval boundaries enforced',`<ul style="margin:0;padding-left:18px;line-height:1.9">${['CRM cannot approve technical laboratory results.','Analysts enter technical data; report release stays with the authorized reviewer / approver.','Section Approver has controlled rights to modify tests / methods and customer details only where required.','Report release is blocked until the required section review / approval is complete.','Combined reports cannot be finalized until all required sections are complete.','Stores disposal must record who disposed the sample and the disposal method.','Quotation, report and invoice signatures are restricted to authorized users.'].map(x=>`<li>${x}</li>`).join('')}</ul>`)}</div>`);
};

const AP_ITEMS=[
 ['Customer / CRM enquiry fields','enquiries'],['Quotation fields, GST, discount and terms','quote/Q-26-0113'],['PO and sample receipt process','samples'],['Registration templates: Pharma / Mech / OM / Gen','regnew/Q-26-0111'],
 ['Test and method copy / edit permissions','reg/P-0145'],['Section allocation and analyst assignment','section'],['Analyst observation / raw-data capture','analyst/W-0291'],['Chemical / standard / equipment usage capture','analyst/W-0291'],
 ['Formula / calculation and result workflow','analyst/W-0291'],['Review and approval process','review/W-0291'],['Report formats and NABL / specification options','report/REG-0138'],['Multi-section combined report process','report/REG-0142'],
 ['Customer submission and dispatch tracking','dispatch'],['Sample retention / disposal process','stores'],['Tax invoice process','invoice/INV-26-0091'],['Notifications','notifications'],['User roles and permissions','roles']];
const QUESTIONS=['What does the “OM” registration template stand for, and which sample fields should it capture?','Lab’s registered state / GSTIN for CGST+SGST vs IGST determination, and bank details for quotation & invoice.','Report / registration / ULR numbering formats (NABL ULR format and financial-year reset).','Default retention period per sample category (Pharma, Mech, OM, Gen) and approved disposal methods.','E-signature method for analysts, approvers and signatory (PIN, password re-entry, or digital certificate).','Formula library: which test calculations should be pre-configured at go-live?','Customer notification channel(s): e-mail only, or SMS / WhatsApp as well?','Should quotation authorization require both Lab HOD and Authorized Signatory (as prototyped), or one of them?'];
let AP=(()=>{try{return JSON.parse(localStorage.getItem('lims.approval')||'{}')}catch(e){return {}}})();
const saveAP=()=>{try{localStorage.setItem('lims.approval',JSON.stringify(AP))}catch(e){}};
R.approval=()=>{
  AP.items=AP.items||{};AP.sign=AP.sign||{};
  const n=AP_ITEMS.length,ok=AP_ITEMS.filter((_,i)=>AP.items[i]?.v==='ok').length,chg=AP_ITEMS.filter((_,i)=>AP.items[i]?.v==='chg').length;
  return page('Client approval checklist','Review each item using the linked prototype screen, mark it Approved or Changes Required and add comments. Responses are saved in this browser; use Print / PDF to share the signed checklist.',
   `<button class="btn" data-act="apReset">Clear responses</button><button class="btn pri" data-act="print">${ic('print')} Print / PDF</button>`,
   `<div class="print-area"><div class="card"><div class="bd"><div class="between"><div><b>Lucid Labs — LIMS workflow & UI/UX approval</b><div class="small muted">Prepared by Nexonweb Solution · baseline for UI/UX design and development</div></div><div class="row"><span class="chip ok">${ok} approved</span><span class="chip warn">${chg} changes</span><span class="chip">${n-ok-chg} open</span></div></div><div class="progress ok mt"><i style="width:${ok/n*100}%"></i></div></div></div>
   <div class="card mt">${AP_ITEMS.map(([l,r],i)=>{const a=AP.items[i]||{};return `<div class="ap-item ${a.v==='ok'?'ok':a.v==='chg'?'chg':''}"><span class="idx">${i+1}</span><div><div class="between" style="justify-content:flex-start;gap:10px"><b>${l}</b><a href="#/${r}" class="small noprint">View screen →</a></div>${a.v==='chg'||a.c?`<textarea placeholder="Describe the change required…" data-in="apC" data-i="${i}">${esc(a.c||'')}</textarea>`:`<button class="btn sm ghost noprint" data-act="apComment" data-i="${i}" style="padding-left:0">+ Add comment</button>`}</div><div class="ap-choice"><label class="${a.v==='ok'?'on-ok':''}"><input type="radio" name="ap${i}" data-act="apSet" data-i="${i}" data-v="ok" ${a.v==='ok'?'checked':''}> Approved</label><label class="${a.v==='chg'?'on-chg':''}"><input type="radio" name="ap${i}" data-act="apSet" data-i="${i}" data-v="chg" ${a.v==='chg'?'checked':''}> Changes required</label></div></div>`}).join('')}</div>
   <div class="card mt"><div class="hd"><h2>Open questions for Lucid Labs</h2><span class="small muted">Assumptions used in this prototype that need confirmation</span></div><div class="bd"><ol style="margin:0;padding-left:20px;line-height:1.9">${QUESTIONS.map(q=>`<li>${q}</li>`).join('')}</ol></div></div>
   <div class="card mt"><div class="hd"><h2>Sign-off</h2></div><div class="bd flush"><div class="table-wrap"><table class="t"><thead><tr><th>Approval</th><th>Name</th><th>Designation</th><th>Date</th></tr></thead><tbody>${['Client Representative','Lucid Labs Representative','Software Project Representative'].map((p,i)=>`<tr><td><b>${p}</b></td><td><input data-in="apS" data-k="n${i}" value="${esc(AP.sign['n'+i]||'')}" placeholder="Full name"></td><td><input data-in="apS" data-k="d${i}" value="${esc(AP.sign['d'+i]||'')}"></td><td><input type="date" data-in="apS" data-k="t${i}" value="${esc(AP.sign['t'+i]||'')}"></td></tr>`).join('')}</tbody></table></div></div></div>
   <p class="small muted mt">By approving, the client confirms that the functional flow and screens represent the required LIMS business process and may be used as the baseline for UI/UX design and software development.</p></div>`);
};

const A={};
A.go=d=>go(d.r);
A.menu=()=>document.body.classList.toggle('nav-open');
A.theme=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;try{localStorage.setItem('lims.theme',nx)}catch(e){}};
A.closeModal=closeModal;
A.saveModal=()=>{const f=$('#mform');if(!f.reportValidity())return;if(modalSave&&modalSave(formData())!==false){closeModal();render()}};
A.print=()=>window.print();
A.tab=(d,el)=>{const card=el.closest('.card');card.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',i==d.i));card.querySelectorAll('.tabpane').forEach((p,i)=>p.classList.toggle('on',i==d.i))};
A.note=d=>{const n=S.notes.find(x=>x.id==d.id);n.read=true;go(n.r)};
A.readAll=()=>{myNotes().forEach(n=>n.read=true);render()};
// Enquiries
A.enqFilter=d=>{enqFilter=d.v;render()};
A.newEnquiry=()=>openModal('New customer enquiry',enquiryForm(),'Create enquiry',f=>{
  const tests=Object.keys(f).filter(k=>k.startsWith('t_')).map(k=>k.slice(2));
  if(!tests.length){toast('Select at least one required test.');return false}
  let cid=f.cust;
  if(cid==='new'){if(!f.nname){toast('Enter the new customer name.');return false}const [city,state]=(f.nstate||',').split(',').map(s=>s.trim());cid='C'+(S.customers.length+1);S.customers.push({id:cid,name:f.nname,city:city||'',state:state||LAB.state,gst:f.gst||'',contact:f.contact,phone:f.nphone||'',email:f.nemail||''})}
  const id='E-0'+(++S.seq.enq);S.enquiries.unshift({id,date:TODAY,source:f.source,cust:cid,contact:f.contact,ref:f.ref||'—',courier:f.courier,tests,status:'New',notes:f.notes});
  toast(`Enquiry <b>${id}</b> created.`);
});
A.enqToQuote=d=>{const e=S.enquiries.find(x=>x.id===d.id);const id='Q-26-0'+(++S.seq.q);S.quotes.unshift({id,date:TODAY,valid:addDays(TODAY,30),enq:e.id,cust:e.cust,status:'Draft',discount:0,items:items(e.tests,e.ref&&e.ref!=='—'?e.ref.slice(0,40):'Sample'),hodOk:false,signedBy:null,terms:DEFAULT_TERMS});e.status='Quotation Prepared';toast(`Draft quotation <b>${id}</b> created with ${e.tests.length} test(s) from ${e.id}.`);go('quote/'+id)};
// Quotes
A.newQuote=()=>{const id='Q-26-0'+(++S.seq.q);S.quotes.unshift({id,date:TODAY,valid:addDays(TODAY,30),enq:null,cust:'C1',status:'Draft',discount:0,items:items(['ASSAY'],'Sample'),hodOk:false,signedBy:null,terms:DEFAULT_TERMS});go('quote/'+id)};
A.qAdd=()=>{const q=quote(param);q.items.push(items(['LOD'],q.items[0]?.desc||'Sample')[0]);render()};
A.qDel=d=>{const q=quote(param);q.items.splice(d.i,1);render()};
A.qStatus=d=>{const q=quote(param);q.status=d.v;if(d.v==='Internal Review')notify(['hod'],`Quotation ${q.id} submitted for internal review — confirm tests & methods.`,'quote/'+q.id);toast(`Quotation ${q.id} → <b>${d.v}</b>`);render()};
A.qHod=()=>{const q=quote(param);q.hodOk=true;notify(['signatory'],`Quotation ${q.id} confirmed by Lab HOD — awaiting authorization.`,'quote/'+q.id);toast('Tests & methods confirmed by HOD.');render()};
A.qAuthorize=()=>{const q=quote(param);q.signedBy=me();q.status='Sent';if(q.enq){const e=S.enquiries.find(x=>x.id===q.enq);if(e)e.status='Quotation Prepared'}toast(`Quotation signed and e-mailed to ${esc(cust(q.cust).contact)} (mock).`);render()};
A.recordPO=d=>{const q=quote(d.id);openModal(`Record PO & sample receipt · ${q.id}`,poForm(q),'Save & confirm receipt',f=>{
  q.po={no:f.no,date:f.date,value:+f.value};q.receipt={date:f.rdate,mode:f.mode,courier:f.courier,awb:f.awb,count:f.count,condition:f.condition,storage:f.storage,by:me(),confirmed:true};q.status='Accepted';
  if(q.enq){const e=S.enquiries.find(x=>x.id===q.enq);if(e)e.status='Closed'}
  notify(['crm'],`PO ${f.no} recorded and sample received for ${q.id} — ready for pre-registration.`,'regnew/'+q.id);toast(`PO <b>${esc(f.no)}</b> recorded · sample received.`)})};
// Registration
A.regTab=d=>{regTab=d.v;render()};
A.dTpl=d=>{DRAFT.template=d.v;render()};
A.dCopy=()=>{const q=quote(DRAFT.q);DRAFT.tests=q.items.map(i=>({code:i.code,method:i.method,spec:i.spec,section:TESTS[i.code].section}));toast(`${DRAFT.tests.length} test(s) copied from ${q.id}.`);render()};
A.dDel=d=>{DRAFT.tests.splice(d.i,1);render()};
A.submitPre=()=>{
  if(!DRAFT.tests.length){toast('Add tests to the test group first.');return}
  if(!DRAFT.sample){toast('Sample name is required.');return}
  const q=quote(DRAFT.q),n=++S.seq.reg,id='P-0'+n;
  S.regs.unshift({id,no:null,pre:`PRE/26-27/0${n}`,q:q.id,cust:q.cust,template:DRAFT.template,sample:DRAFT.sample,qty:DRAFT.qty,received:q.receipt.date,regDate:null,status:'Pre-Registered',report:null,fields:{...DRAFT.fields},tests:DRAFT.tests,tat:addDays(q.receipt.date,DRAFT.tat==='Urgent'?3:7),reportType:'final',nabl:true,spec:true,custEdit:null});
  notify(['regrev'],`Pre-registration PRE/26-27/0${n} (${DRAFT.sample}) awaiting registration review.`,'reg/'+id);
  DRAFT=null;toast(`Pre-registration <b>PRE/26-27/0${n}</b> submitted for review.`);go('reg/'+id)};
A.regApprove=d=>{const r=reg(d.id);const n=r.pre.split('/').pop();const nid='REG-'+n;
  r.id=nid;r.no=`LL/REG/26-27/${n}`;r.status='Registered';r.report='Draft';r.regDate=TODAY;
  r.tests.forEach(t=>S.work.push({id:'W-0'+(++S.seq.w),reg:nid,code:t.code,section:t.section,analyst:null,status:'Unassigned',method:t.method,spec:t.spec,unit:TESTS[t.code].unit,values:[],reps:2,result:'',raw:'',chem:[],equip:[],files:[],remarks:'',signed:null,returnNote:'',reviewNote:'',reviewedBy:'',calc:{}}));
  S.notes.forEach(x=>{if(x.r==='reg/'+d.id)x.r='reg/'+nid});
  const secs=[...new Set(r.tests.map(t=>t.section))];
  notify(['secapp'],`${nid} registered to ${secs.join(' & ')} — awaiting analyst allocation.`,'section');
  notify(['crm'],`Registration details for ${nid} e-mailed to ${cust(r.cust).contact}.`,'reg/'+nid);
  toast(`Registered as <b>${r.no}</b> · customer notified by e-mail.`);go('reg/'+nid)};
A.regReturn=d=>{toast('Returned to CRM with comments (mock).')};
// Section
A.secTab=d=>{SEC=d.v;secSel.clear();render()};

A.editMethod=d=>{const w=wk(d.id);openModal(`Edit test / method · ${TESTS[w.code].name}`,`<div class="fgrid"><label class="f full"><span>Method</span><input name="m" value="${esc(w.method)}"></label><label class="f"><span>Specification</span><input name="s" value="${esc(w.spec)}"></label><label class="f"><span>Reason for change</span><input name="why" required placeholder="Required for audit trail"></label></div>`,'Save change',f=>{w.method=f.m;w.spec=f.s;toast('Method updated · change logged to audit trail.')})};

A.wApplyCalc=()=>{const w=wk(param),F=FORMULAS[w.code],s=stats(w.values);const v=F?F.fn(w.calc):s?s.avg:null;if(v==null){toast('Enter values first.');return}w.result=String(round(v,2));render();A.tab({i:4},$('.tabs button'))};
A.wSubmit=()=>{const w=wk(param);if(!w.result){toast('Enter the final result before submitting.');return}if(!w.signed){toast('Analyst signature is required — see “Remarks & signature”.');return}
  w.status='Submitted for Review';notify(['secapp'],`${TESTS[w.code].name} (${w.reg}) submitted for review by ${w.analyst}.`,'review/'+w.id);toast('Submitted for review · reviewer notified.');render()};
