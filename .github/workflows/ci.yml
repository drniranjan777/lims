name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lims
          POSTGRES_PASSWORD: lims
          POSTGRES_DB: lims_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lims" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lims:lims@localhost:5432/lims_ci?schema=public
      TEST_DATABASE_URL: postgresql://lims:lims@localhost:5432/lims_test?schema=public
      JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --workspace @lims/api prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Browser end-to-end workflow; starts its own API (port 4100) and web (port 3100) on TEST_DATABASE_URL
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
